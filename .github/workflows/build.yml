name: 构建 iOS 产物

# 每次 push 到 main、每次 PR 更新都会打包 iOS 模拟器 App；也可在 Actions 页面手动触发。
# Android job 暂时停用：配置保留，待 Gradle 失败原因定位后删除 `if: false` 即可恢复。
# 想让所有分支的 push 都触发，把 branches 改成 ['**'] 即可。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一个 ref 上新构建会取消旧构建，避免 macOS 分钟被连续 push 堆满。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  # 轻量门槛：类型检查、测试、双平台 JS bundle。原生 job 依赖它，先失败就不浪费原生编译。
  check:
    name: 检查 + JS bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # pnpm 12 需要 v6+ 的 action；版本从 package.json 的 packageManager 读取，
      # 不要在这里再写 version（会冲突）。
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 环境版本
        run: |
          node --version
          pnpm --version
      - name: 类型检查 + 29 个测试
        run: pnpm run check
      - name: 导出 Android / iOS JS bundle
        run: pnpm run bundle:check
      - name: 上传 JS bundle
        uses: actions/upload-artifact@v4
        with:
          name: js-bundles-android-ios
          path: .expo/export/
          if-no-files-found: error
          retention-days: 14
      - name: 写入运行摘要
        run: |
          {
            echo '### 检查通过'
            echo "- Node $(node --version) / pnpm $(pnpm --version)"
            echo '- `pnpm run check`：类型检查 + 29 个测试通过'
            echo '- `pnpm run bundle:check`：Android / iOS Hermes bundle 已导出'
            echo '- 产物 `js-bundles-android-ios`（不需要设备）'
            echo '- Android 原生 job 暂时停用；本次只继续跑 iOS 模拟器 App'
          } >> "$GITHUB_STEP_SUMMARY"

  # Android 原生编译暂时停用，保留完整 job 配置方便后续恢复。
  # 恢复时删除下一行 `if: false` 即可。
  android:
    if: false
    name: Android APK / AAB（暂时停用）
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # ubuntu-latest 已预装 Android SDK 并设置 ANDROID_HOME。不要用 setup-android@v3，
      # 它会去装已下架的 legacy `tools` 包而失败。RN 0.86.3 锁定 API 36 /
      # Build Tools 36.0.0 / NDK 27.1.12297006；镜像自带的 NDK 是 27.3/29/30，
      # 必须显式补齐，否则 AGP 自动下载 NDK 容易拿到坏包。
      - name: 定位预装 SDK 并补齐组件
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          sdkmanager_cmd="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_cmd" ]; then
            sdkmanager_cmd="$(command -v sdkmanager || true)"
          fi
          if [ -z "$sdkmanager_cmd" ]; then
            echo '::error::找不到 sdkmanager'
            exit 1
          fi
          yes | "$sdkmanager_cmd" --licenses > /dev/null || true
          "$sdkmanager_cmd" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
      - name: 生成原生工程
        run: pnpm exec expo prebuild --platform android --no-install
      # Expo 的启动图样式无条件引用 @drawable/splashscreen_logo；缺少 image 时
      # Gradle 链接资源才会失败，这里提前给出可定位的错误。
      - name: 校验 Android 启动图资源
        run: |
          if ! find android/app/src/main/res -type f -name 'splashscreen_logo.png' -print -quit | grep -q .; then
            echo '::error::prebuild 未生成 splashscreen_logo；检查 app.config.ts 的 expo-splash-screen image 配置'
            exit 1
          fi
          find android/app/src/main/res -type f -name 'splashscreen_logo.png' -print
      - name: 让 Gradle 使用预装 SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      # release 变体使用 prebuild 生成的 debug keystore，仅用于本地安装测试，不能上架。
      - name: 编译 APK / AAB
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
      - name: 整理产物
        run: |
          mkdir -p artifacts
          find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0 |
            while IFS= read -r -d '' f; do
              cp "$f" "artifacts/Calliope-${GITHUB_RUN_NUMBER}-$(basename "$f")"
            done
          ls -lh artifacts
      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: 写入运行摘要
        run: |
          {
            echo '### Android 产物'
            echo '- debug APK / release APK / release AAB 已上传到 `android-builds`'
            echo '- release 使用生成的 debug keystore 签名，仅用于安装测试，不能上架'
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS 模拟器 App
    needs: check
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Expo SDK 57 的 expo-modules-jsi/apple SwiftPM 包声明 swift-tools-version: 6.2；
      # macos-15 默认的 Xcode 16.4 只带 Swift 6.1，会报 Could not resolve package dependencies。
      - name: 选择 Xcode 26.x（Swift 6.2+）
        run: |
          set -euo pipefail
          xcode=''
          for candidate in \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then
              xcode="$candidate"
              break
            fi
          done
          if [ -z "$xcode" ]; then
            echo '::error::找不到 Xcode；macos-15 镜像应提供 Xcode 26.x'
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun swift --version
          swift_version="$(xcrun swift --version | sed -nE 's/.*Apple Swift version ([0-9]+\.[0-9]+).*/\1/p')"
          if [ -z "$swift_version" ]; then
            echo '::error::无法读取 Swift 版本'
            exit 1
          fi
          major="${swift_version%%.*}"
          minor="${swift_version##*.}"
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 2 ]; }; then
            echo "::error::$xcode 的 Swift $swift_version 低于 6.2；ExpoModulesJSI 的 SwiftPM 包需要 6.2"
            exit 1
          fi
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 生成原生工程
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: 安装 CocoaPods
        working-directory: ios
        run: pod install
      # scheme / workspace 名跟 app.config.ts 的 name 走，运行时探测，改名也不会失效。
      - name: 探测 scheme 与 workspace
        run: |
          proj="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          if [ -z "$proj" ]; then
            echo '::error::没有找到生成的 .xcodeproj'
            exit 1
          fi
          scheme="$(basename "$proj" .xcodeproj)"
          workspace="ios/$scheme.xcworkspace"
          if [ ! -d "$workspace" ]; then
            echo "::error::没有找到 pod install 生成的 $workspace"
            exit 1
          fi
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"
          echo "WORKSPACE=$workspace" >> "$GITHUB_ENV"
          echo "scheme=$scheme / workspace=$workspace"
      # 模拟器构建不需要签名，因此不需要任何 Apple 证书 / secrets。
      # -quiet 避免 xcodebuild 打出几十 MB 日志被 GitHub 截断，失败时另存日志便于定位。
      - name: xcodebuild（Release / 模拟器 / 不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ios-xcodebuild.log
      - name: xcodebuild 失败诊断
        if: failure()
        run: |
          if [ -f ios-xcodebuild.log ]; then
            echo '=== error / fatal 行 ==='
            grep -nE 'error:|fatal error:|BUILD FAILED|The following build commands failed' ios-xcodebuild.log | tail -60 || true
            echo '=== SwiftPM 依赖解析错误上下文 ==='
            grep -n -B5 -A12 'Could not resolve package dependencies' ios-xcodebuild.log || true
            echo '=== 日志末尾 80 行 ==='
            tail -n 80 ios-xcodebuild.log
          fi
      - name: 上传 xcodebuild 日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: ios-xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
      - name: 打包 .app
        run: |
          app="$(find ios/build/Build/Products -type d -name "${SCHEME}.app" -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::没有找到 ${SCHEME}.app"
            find ios/build/Build/Products -maxdepth 3 -type d -name '*.app' -print || true
            exit 1
          fi
          echo "app=$app"
          zip_name="Calliope-ios-simulator-${GITHUB_RUN_NUMBER}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip_name"
          ls -lh "$zip_name"
      - name: 上传 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: Calliope-ios-simulator-*.app.zip
          if-no-files-found: error
          retention-days: 14
      - name: 写入运行摘要
        run: |
          {
            echo '### iOS 产物'
            echo "- $(xcodebuild -version | head -1)"
            echo '- Release 配置的模拟器 `.app.zip` 已上传到 `ios-simulator-app`'
            echo '- 未签名，只能装进 iOS Simulator；真机 IPA 需要另外配置签名证书'
          } >> "$GITHUB_STEP_SUMMARY"
